<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Volunteer Portal</title>
<style>
  :root{
    --primary:#4f46e5; --primary-dark:#4338ca; --bg:#f4f5f9; --card:#ffffff;
    --danger:#e11d48; --danger-dark:#be123c; --success:#16a34a;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;}
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(160deg,var(--primary),#7c3aed);}
  .login-card{background:var(--card); border-radius:16px; padding:28px 24px; width:100%; max-width:380px; box-shadow:0 10px 30px rgba(0,0,0,.2);}
  .login-logo{display:flex; justify-content:center; margin-bottom:10px;}
  .login-logo img{max-height:56px; max-width:180px; object-fit:contain;}
  .login-card h1{margin:0 0 4px; font-size:22px; text-align:center;}
  .login-card p.sub{margin:0 0 20px; text-align:center; color:var(--muted); font-size:13px;}
  .login-hint{background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; font-size:12px; padding:10px 12px; border-radius:10px; margin-bottom:16px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text);}
  .field input, .field select, .field textarea{width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px; font-size:15px; background:#fff; color:var(--text);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary); border-color:var(--primary);}
  .field .hint{font-size:11px; color:var(--muted); margin-top:4px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 16px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; background:var(--primary); color:#fff; width:100%;}
  .btn:active{background:var(--primary-dark);}
  .btn:disabled{opacity:.6;}
  .btn-secondary{background:#eef0f4; color:var(--text);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-danger:active{background:var(--danger-dark);}
  .btn-sm{padding:8px 12px; font-size:13px; width:auto;}
  .error-msg{color:var(--danger); font-size:13px; margin:-6px 0 14px; min-height:1px;}
  .success-msg{color:var(--success); font-size:13px; margin:-6px 0 14px; min-height:1px;}
  .topbar{background:var(--primary); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; gap:10px;}
  .topbar .brand{display:flex; align-items:center; gap:8px; min-width:0;}
  .topbar .brand img{height:32px; max-width:100px; object-fit:contain; border-radius:6px; background:#fff; padding:2px;}
  .topbar .title{font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .title small{display:block; font-size:11px; font-weight:400; opacity:.85;}
  .topbar .logout-btn{background:rgba(255,255,255,.15); border:none; color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0;}
  .content{flex:1; padding:16px; padding-bottom:90px; max-width:640px; margin:0 auto; width:100%;}
  .bottomnav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:20;}
  .bottomnav button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; font-size:10.5px; color:var(--muted); cursor:pointer; border-radius:10px;}
  .bottomnav button .ic{font-size:19px;}
  .bottomnav button.active{color:var(--primary); background:#eef0ff;}
  .grid-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .stat-card{background:var(--card); border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .stat-card .num{font-size:26px; font-weight:800; color:var(--primary);}
  .stat-card .label{font-size:12px; color:var(--muted); margin-top:2px;}
  .section-title{font-size:15px; font-weight:700; margin:18px 0 10px; display:flex; align-items:center; justify-content:space-between;}
  .card{background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); cursor:default;}
  .card.clickable{cursor:pointer;}
  .card .row1{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .card h3{margin:0; font-size:15px;}
  .card .meta{font-size:12px; color:var(--muted); margin-top:4px;}
  .badge{display:inline-block; font-size:11px; padding:3px 8px; border-radius:20px; font-weight:600; margin-top:6px;}
  .badge-green{background:#dcfce7; color:#166534;}
  .badge-red{background:#fee2e2; color:#991b1b;}
  .badge-gray{background:#f1f5f9; color:#475569;}
  .badge-indigo{background:#e0e7ff; color:#3730a3;}
  .icon-btn{background:none; border:none; font-size:18px; cursor:pointer; padding:6px 8px; border-radius:8px;}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn:active{background:#f1f1f1;}
  .toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .toolbar input[type="text"]{flex:1; padding:11px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px;}
  .toolbar .btn{width:auto; padding:11px 16px;}
  .add-form{background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; border:1px dashed var(--primary);}
  .add-form h4{margin:0 0 12px; font-size:14px;}
  .form-actions{display:flex; gap:8px; margin-top:4px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:14px;}
  .checkbox-row input{width:auto;}
  .empty-state{text-align:center; padding:30px 10px; color:var(--muted); font-size:14px;}
  .empty-state .ic{font-size:34px; display:block; margin-bottom:8px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--border);}
  th{color:var(--muted); font-weight:600; font-size:12px;}
  .status-btns{display:flex; gap:6px;}
  .status-btn{flex:1; padding:8px 4px; border-radius:8px; border:1px solid var(--border); background:#fff; font-size:12px; font-weight:600; cursor:pointer; color:var(--muted);}
  .status-btn.present.active{background:#dcfce7; border-color:#16a34a; color:#166534;}
  .status-btn.absent.active{background:#fee2e2; border-color:#e11d48; color:#991b1b;}
  .welcome-card{background:linear-gradient(135deg,var(--primary),#7c3aed); color:#fff; border-radius:16px; padding:18px; margin-bottom:16px;}
  .welcome-card h2{margin:0 0 4px; font-size:19px;}
  .welcome-card p{margin:0; font-size:13px; opacity:.9;}
  .avatar{border-radius:50%; object-fit:cover; background:#e0e7ff; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--primary); flex-shrink:0;}
  .avatar-sm{width:42px; height:42px; font-size:15px;}
  .avatar-lg{width:88px; height:88px; font-size:28px; margin:0 auto;}
  .card-with-avatar{display:flex; gap:12px; align-items:center;}
  .card-with-avatar .info{flex:1; min-width:0;}
  .profile-header{text-align:center; margin-bottom:18px;}
  .profile-header .role-badge{margin-top:4px;}
  .photo-upload-row{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px;}
  .photo-upload-row label.upload-btn{background:#eef0ff; color:var(--primary); font-size:12px; font-weight:600; padding:7px 14px; border-radius:20px; cursor:pointer;}
  .photo-upload-row input[type=file]{display:none;}
  .back-link{background:none; border:none; color:var(--primary); font-size:14px; font-weight:600; padding:4px 0; margin-bottom:10px; cursor:pointer;}
  .theme-swatches{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .swatch{width:56px; height:56px; border-radius:14px; cursor:pointer; border:3px solid transparent; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff;}
  .swatch.selected{border-color:#111827;}
  .logo-preview-box{display:flex; align-items:center; gap:14px; margin-bottom:16px; background:#fafafa; padding:12px; border-radius:12px; border:1px solid var(--border);}
  .logo-preview-box img{max-height:48px; max-width:120px; object-fit:contain;}
  .logo-preview-box .placeholder{width:48px; height:48px; border-radius:10px; background:#eef0ff; display:flex; align-items:center; justify-content:center; font-size:22px;}
  .announce-card{background:#fffbeb; border:1px solid #fde68a; border-radius:14px; padding:14px; margin-bottom:16px; display:flex; gap:10px; align-items:flex-start;}
  .announce-card .ic{font-size:20px;}
  .announce-card .txt{flex:1; font-size:13px; color:#78350f; white-space:pre-wrap;}
  .hours-input{width:60px; padding:6px; border:1px solid var(--border); border-radius:8px; font-size:13px; text-align:center;}
  .hours-row{display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color:var(--muted);}
  .chart-card{background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .chart-card h4{margin:0 0 14px; font-size:14px;}
  .chart-bars{display:flex; align-items:flex-end; gap:6px; height:130px;}
  .chart-bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0;}
  .chart-bar{width:100%; background:var(--primary); border-radius:6px 6px 0 0; min-height:3px;}
  .chart-bar-value{font-size:10px; font-weight:700; color:var(--text); margin-bottom:3px;}
  .chart-bar-label{font-size:9px; color:var(--muted); margin-top:5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;}
  .top-vol-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
  .top-vol-row:last-child{border-bottom:none;}
  .top-vol-rank{width:22px; height:22px; border-radius:50%; background:#eef0ff; color:var(--primary); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .log-list{display:flex; flex-direction:column; gap:0;}
  .log-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .log-row:last-child{border-bottom:none;}
  .log-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .log-dot.present{background:var(--success);}
  .log-dot.absent{background:var(--danger);}
  .log-date{flex:1; font-size:13px; font-weight:600;}
  .log-sub{font-size:11px; color:var(--muted); margin-top:1px;}
</style>
</head>

<script>
/* =========================================================================
   FIREBASE CONFIG -- REPLACE WITH YOUR OWN PROJECT'S VALUES
   (Firebase Console -> Project settings -> Your apps -> Web app -> Config)
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAIEBreuxaCN78B_PVt_U61ZBVVGbyP7Go",
  authDomain: "thl-volunteer-portal-e2d17.firebaseapp.com",
  projectId: "thl-volunteer-portal-e2d17",
  storageBucket: "thl-volunteer-portal-e2d17.firebasestorage.app",
  messagingSenderId: "360051526354",
  appId: "1:360051526354:web:34392672532fee7c7c3b0b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* ============================= CONSTANTS ============================= */
const THEME_PRESETS=[
  {name:'Indigo', primary:'#4f46e5', primaryDark:'#4338ca', bg:'#f4f5f9', ic:'🟣'},
  {name:'Ocean',  primary:'#0284c7', primaryDark:'#0369a1', bg:'#f0f9ff', ic:'🔵'},
  {name:'Forest', primary:'#16a34a', primaryDark:'#15803d', bg:'#f0fdf4', ic:'🟢'},
  {name:'Sunset', primary:'#ea580c', primaryDark:'#c2410c', bg:'#fff7ed', ic:'🟠'},
  {name:'Rose',   primary:'#e11d48', primaryDark:'#be123c', bg:'#fff1f2', ic:'🔴'},
  {name:'Slate',  primary:'#334155', primaryDark:'#1e293b', bg:'#f1f5f9', ic:'⚫'}
];

/* ============================= HELPERS ============================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
}
function friendlyAuthError(err){
  const code = (err && err.code) || '';
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
  if(code.includes('invalid-email')) return 'That email address looks invalid.';
  if(code.includes('email-already-in-use')) return 'That email is already registered.';
  if(code.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(code.includes('too-many-requests')) return 'Too many attempts. Try again later.';
  if(code.includes('network')) return 'Network error. Check your connection.';
  return (err && err.message) || 'Something went wrong. Please try again.';
}
function totalHoursFor(volunteerId){
  return getAttendance().filter(function(a){ return a.volunteerId===volunteerId && a.status==='present'; })
    .reduce(function(sum,a){ return sum + (Number(a.hours)||0); }, 0);
}
function totalContributionFor(volunteerId){
  return getAttendance().filter(function(a){ return a.volunteerId===volunteerId; })
    .reduce(function(sum,a){ return sum + (Number(a.contribution)||0); }, 0);
}
const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EVENT_CATEGORIES=['Meeting','Outreach','Training','Fundraiser','Social','Other'];
function eventIsDueToday(e){
  if(e.recurring==='weekly'){ return new Date().getDay() === Number(e.dayOfWeek); }
  return e.date === todayStr();
}
function currentSessionDate(e){
  if(e.recurring!=='weekly') return e.date;
  const target = Number(e.dayOfWeek);
  const d = new Date();
  const diff = (d.getDay() - target + 7) % 7;
  d.setDate(d.getDate() - diff);
  return d.toISOString().slice(0,10);
}
function weeklyStats(limit){
  const map = {};
  getAttendance().forEach(function(a){
    const ev = getEvents().find(function(e){ return e.id===a.eventId; });
    const d = a.sessionDate || (ev? ev.date : null);
    if(!d) return;
    if(!map[d]) map[d] = {present:0, contribution:0};
    if(a.status==='present'){ map[d].present += 1; }
    map[d].contribution += (Number(a.contribution)||0);
  });
  const dates = Object.keys(map).sort();
  const recent = dates.slice(-(limit||8));
  return recent.map(function(d){ return {date:d, present:map[d].present, contribution:map[d].contribution}; });
}
function topVolunteers(limit){
  const counts = {};
  getAttendance().forEach(function(a){
    if(a.status==='present'){ counts[a.volunteerId] = (counts[a.volunteerId]||0) + 1; }
  });
  return Object.keys(counts).map(function(vid){
    const v = getVolunteers().find(function(vv){ return vv.id===vid; });
    return {vid:vid, name: v? v.name : 'Unknown', count: counts[vid]};
  }).sort(function(a,b){ return b.count - a.count; }).slice(0, limit||5);
}
function renderBarChart(items, valueKey, formatFn){
  const max = Math.max.apply(null, items.map(function(it){ return it[valueKey]; }).concat([1]));
  return `<div class="chart-bars">${items.map(function(it){
    const pct = Math.max(4, Math.round((it[valueKey]/max)*100));
    const short = (it.date||'').slice(5);
    return `<div class="chart-bar-col">
      <div class="chart-bar-value">${formatFn? formatFn(it[valueKey]) : it[valueKey]}</div>
      <div class="chart-bar" style="height:${pct}%;"></div>
      <div class="chart-bar-label">${escapeHtml(short)}</div>
    </div>`;
  }).join('')}</div>`;
}
function formatDateNice(dateStr){
  if(!dateStr) return '-';
  const parts = dateStr.split('-');
  if(parts.length!==3) return dateStr;
  const d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return DAY_NAMES[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function recurringAttendanceBreakdown(volunteerId){
  const byEvent = {};
  getAttendance().forEach(function(a){
    if(a.volunteerId!==volunteerId) return;
    const ev = getEvents().find(function(e){ return e.id===a.eventId; });
    if(!ev || ev.recurring!=='weekly') return;
    if(!byEvent[ev.id]) byEvent[ev.id] = {event:ev, dates:[]};
    byEvent[ev.id].dates.push({date: a.sessionDate || ev.date, status: a.status, contribution: Number(a.contribution)||0});
  });
  return Object.keys(byEvent).map(function(k){
    byEvent[k].dates.sort(function(a,b){ return b.date.localeCompare(a.date); });
    return byEvent[k];
  });
}
function attendeeCountForEvent(e){
  if(e.recurring==='weekly'){
    const sd = currentSessionDate(e);
    return getAttendance().filter(function(a){ return a.eventId===e.id && a.status==='present' && (a.sessionDate||sd)===sd; }).length;
  }
  return getAttendance().filter(function(a){ return a.eventId===e.id && a.status==='present'; }).length;
}
function renderAnalytics(){
  const weekly = weeklyStats(8);
  const top = topVolunteers(5);
  return `
  <button class="back-link" data-action="back-to-dashboard">&larr; Back to Dashboard</button>
  <div class="section-title">Attendance by Session</div>
  <div class="chart-card">
    ${weekly.length? renderBarChart(weekly, 'present') : emptyState('📊','No attendance data yet.')}
  </div>
  <div class="section-title">Contributions by Session</div>
  <div class="chart-card">
    ${weekly.length? renderBarChart(weekly, 'contribution', function(v){ return v; }) : emptyState('📊','No contribution data yet.')}
  </div>
  <div class="section-title">Most Active Volunteers</div>
  <div class="chart-card">
    ${top.length? top.map(function(t,i){
      return `<div class="top-vol-row"><div class="top-vol-rank">${i+1}</div><div style="flex:1;">${escapeHtml(t.name)}</div><span class="badge badge-green">${t.count}x</span></div>`;
    }).join('') : emptyState('🏆','No attendance data yet.')}
  </div>
  `;
}

/* ============================= Q&A ============================= */
function renderQA(){
  const isAdmin = currentUser.role==='admin';
  const s = getSettings();
  const contactLine = s.contactEmail
    ? `<div class="empty-state" style="padding:10px 4px; text-align:left;">Prefer email? Reach us directly at <a href="mailto:${escapeHtml(s.contactEmail)}">${escapeHtml(s.contactEmail)}</a></div>`
    : '';

  if(isAdmin){
    const questions = getQuestions().slice().sort(function(a,b){
      const aPending = a.status!=='answered' ? 0 : 1;
      const bPending = b.status!=='answered' ? 0 : 1;
      if(aPending!==bPending) return aPending-bPending;
      return (b.time||'').localeCompare(a.time||'');
    });
    return `
    <button class="back-link" data-action="back-to-dashboard">&larr; Back to Dashboard</button>
    <div class="section-title">Questions & Answers (${questions.length})</div>
    ${questions.length? questions.map(function(q){
      return `<div class="card">
        <div class="meta" style="font-weight:700; color:var(--text); font-size:13px;">${escapeHtml(q.askedByName||'Volunteer')}</div>
        <div class="meta">${escapeHtml(q.question)}</div>
        ${q.status==='answered'? `
          <div class="announce-card" style="margin-top:8px;"><span class="ic">💬</span><div class="txt">${escapeHtml(q.answer)}</div></div>
        ` : `
          <div class="field" style="margin-top:8px;"><textarea rows="2" placeholder="Type your reply..." data-action="answer-input" data-qid="${q.id}"></textarea></div>
          <button class="btn btn-sm" data-action="answer-question" data-qid="${q.id}">Send Reply</button>
        `}
      </div>`;
    }).join('') : emptyState('❓','No questions yet.')}
    `;
  } else {
    const myQuestions = getQuestions().slice().sort(function(a,b){ return (b.time||'').localeCompare(a.time||''); });
    return `
    <div class="section-title">Ask a Question</div>
    <form class="add-form" id="askForm">
      <div class="field"><textarea id="questionInput" rows="3" placeholder="Type your question for the admin..." required></textarea></div>
      <div class="error-msg" id="ask_error"></div>
      <div class="form-actions"><button type="submit" class="btn">Send Question</button></div>
    </form>
    ${contactLine}
    <div class="section-title">Your Questions</div>
    ${myQuestions.length? myQuestions.map(function(q){
      return `<div class="card">
        <div class="meta">${escapeHtml(q.question)}</div>
        ${q.status==='answered'
          ? `<div class="announce-card" style="margin-top:8px;"><span class="ic">💬</span><div class="txt">${escapeHtml(q.answer)}</div></div>`
          : `<span class="badge badge-gray" style="margin-top:6px;">Waiting for answer</span>`}
      </div>`;
    }).join('') : emptyState('❓','No questions asked yet.')}
    `;
  }
}
function downloadCSV(filename, rows){
  const csv = rows.map(function(row){
    return row.map(function(cell){
      const s = String(cell==null?'':cell).replace(/"/g,'""');
      return /[",\n]/.test(s) ? '"'+s+'"' : s;
    }).join(',');
  }).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function resizeImageFile(file, maxDim, quality, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

auth.onAuthStateChanged(async function(fbUser){
  if(fbUser){
    if(settingUpInProgress || selfSignupInProgress) return; // doSetup()/doSignup() manage currentUser themselves
    try{
      const doc = await db.collection('users').doc(fbUser.uid).get();
      if(!doc.exists){
        loginError='Your account was not found. It may have been removed by an admin.';
        await auth.signOut();
        currentUser=null; render(); return;
      }
      currentUser = Object.assign({uid:fbUser.uid, email:fbUser.email}, doc.data());
      startPrivateListeners();
      currentPage='dashboard';
      render();
    }catch(e){
      loginError='Could not load your account. Check your connection and try again.';
      await auth.signOut();
      render();
    }
  } else {
    currentUser=null;
    stopPrivateListeners();
    render();
  }
});

  const secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary'+Date.now());

    .then(function(cred){
      return db.collection('users').doc(cred.user.uid).set({role:'volunteer', name:name, email:email.trim(), volunteerId:volunteerId});
    })
    .then(function(){ return secondaryApp.auth().signOut(); })
    .then(function(){ return secondaryApp.delete(); });

function doSignup(name, email, password, phone){
  signupError='';
  if(!name.trim()){ signupError='Name is required.'; render(); return; }
  if(password.length < 6){ signupError='Password must be at least 6 characters.'; render(); return; }
  selfSignupInProgress = true;
  auth.createUserWithEmailAndPassword(email.trim(), password).then(function(cred){
    return db.collection('volunteers').add({name:name.trim(), phone:(phone||'').trim(), email:email.trim(), skills:'', photo:'', joinDate:todayStr()})
      .then(function(volRef){
        const profile = {role:'volunteer', name:name.trim(), email:email.trim(), volunteerId:volRef.id};
        return db.collection('users').doc(cred.user.uid).set(profile).then(function(){
          currentUser = Object.assign({uid:cred.user.uid, email:email.trim()}, profile);
          selfSignupInProgress=false;
          startPrivateListeners();
          currentPage='dashboard';
          render();
        });
      });
  }).catch(function(err){
    selfSignupInProgress=false;
    signupError = friendlyAuthError(err);
    render();
  });
}

function createAdminLogin(name, email, password){
  const secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary'+Date.now());
  let newUid=null;
  return secondaryApp.auth().createUserWithEmailAndPassword(email.trim(), password)
    .then(function(cred){

function eventCard(e, isAdmin){
  const isFuture = !e.recurring && e.date > todayStr();
  const isPast = !e.recurring && e.date < todayStr();
  const isRecurring = e.recurring==='weekly';
  const goingCount = getRsvps().filter(function(r){ return r.eventId===e.id && r.response==='yes'; }).length;
  const myRsvp = !isAdmin && currentUser.volunteerId
    ? getRsvps().find(function(r){ return r.eventId===e.id && r.volunteerId===currentUser.volunteerId && r.response==='yes'; })
    : null;
  return `
  <div class="card">
    <div class="row1"><h3>${escapeHtml(e.name)}</h3>${isAdmin? `<button class="icon-btn danger" data-action="delete-event" data-id="${e.id}">🗑️</button>`:''}</div>
    ${isRecurring
      ? `<div class="meta">🔁 Every ${DAY_NAMES[Number(e.dayOfWeek)]} ${e.time? '· ⏰ '+escapeHtml(e.time):''}</div>`
      : `<div class="meta">📅 ${escapeHtml(e.date)} ${e.time? '· ⏰ '+escapeHtml(e.time):''}</div>`}
    ${e.location? `<div class="meta">📍 ${escapeHtml(e.location)}</div>`:''}
    ${e.description? `<div class="meta">${escapeHtml(e.description)}</div>`:''}
    <span class="badge ${isRecurring?'badge-indigo':(isPast?'badge-gray':'badge-green')}">${isRecurring?'Weekly':(isPast?'Past':'Upcoming')}</span>
    <span class="badge badge-gray">🏷️ ${escapeHtml(e.category||'Other')}</span>
    ${isAdmin? `<span class="badge badge-gray">${goingCount} going</span>` : ''}
    ${isAdmin && !isFuture? `<span class="badge badge-green">✅ ${attendeeCountForEvent(e)} attended${isRecurring?' this week':''}</span>` : ''}
    ${isAdmin && isFuture? `<span class="badge badge-gray">📌 Not started yet</span>` : ''}
    ${!isAdmin && !isPast ? (
      myRsvp
        ? `<div style="margin-top:8px;"><span class="badge badge-green">✅ You're going</span> <button class="icon-btn" data-action="rsvp-cancel" data-eid="${e.id}" style="font-size:12px;">Cancel</button></div>`
        : `<button class="btn btn-sm" data-action="rsvp-yes" data-eid="${e.id}" style="margin-top:8px;">🙋 I'm Going</button>`
    ) : ''}
  </div>`;
}

/* ============================= ATTENDANCE ============================= */
function renderAttendance(){
  const isAdmin = currentUser.role==='admin';
  const events = getEvents().slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  if(!selectedEventId && events.length) selectedEventId = events[0].id;
  const selectedEvent = events.find(function(e){ return e.id===selectedEventId; });

  if(isAdmin){
    const volunteers = getVolunteers();
    const attendance = getAttendance();
    const isRecurring = selectedEvent && selectedEvent.recurring==='weekly';
    const isFutureOneOff = selectedEvent && !isRecurring && selectedEvent.date > todayStr();
    if(isRecurring && !attendanceSessionDate) attendanceSessionDate = currentSessionDate(selectedEvent);
    const sessionDate = isRecurring ? attendanceSessionDate : (selectedEvent? selectedEvent.date : null);

    if(isFutureOneOff){
      return `
      <div class="section-title">Take Attendance</div>
      <div class="field"><label>Select Event</label>
        <select id="eventSelect">${events.map(function(e){ return `<option value="${e.id}" ${e.id===selectedEventId?'selected':''}>${escapeHtml(e.name)} ${e.recurring==='weekly'?'(Weekly - '+DAY_NAMES[Number(e.dayOfWeek)]+')':'('+escapeHtml(e.date)+')'}</option>`; }).join('')}</select>
      </div>
      <div class="empty-state"><span class="ic">📌</span>This event is scheduled for ${escapeHtml(selectedEvent.date)} and hasn't happened yet.<br>Attendance can be recorded starting on the day of the event.</div>
      `;
    }

    const rows = volunteers.map(function(v){
      const rec = attendance.find(function(a){ return a.eventId===selectedEventId && a.volunteerId===v.id && (a.sessionDate||selectedEvent.date)===sessionDate; });
      const status = rec? rec.status : '';
      const hrs = rec && rec.hours!=null ? rec.hours : 2;
      const contrib = rec && rec.contribution!=null ? rec.contribution : 0;
      return `
      <div class="card"><div class="card-with-avatar">
        ${v.photo? `<img class="avatar avatar-sm" src="${v.photo}">` : `<div class="avatar avatar-sm">${initials(v.name)}</div>`}
        <div class="info"><h3 style="font-size:14px;">${escapeHtml(v.name)}</h3>
          <div class="status-btns" style="margin-top:6px;">
            <button class="status-btn present ${status==='present'?'active':''}" data-action="mark-attendance" data-vid="${v.id}" data-status="present">✅ Present</button>
            <button class="status-btn absent ${status==='absent'?'active':''}" data-action="mark-attendance" data-vid="${v.id}" data-status="absent">❌ Absent</button>
          </div>
          ${status==='present'? `
          <div class="hours-row">Hours: <input type="number" min="0" step="0.5" class="hours-input" data-action="set-hours" data-vid="${v.id}" value="${hrs}"></div>
          ` : ''}
          ${status? `
          <div class="hours-row">Contribution: <input type="number" min="0" step="0.01" class="hours-input" data-action="set-contribution" data-vid="${v.id}" value="${contrib}"></div>
          ` : ''}
        </div>
      </div></div>`;
    }).join('');
    return `
    <div class="section-title">Take Attendance<button class="btn btn-sm btn-secondary" id="exportAttendanceCsv">⬇️ Export CSV</button></div>
    ${events.length? `
    <div class="field"><label>Select Event</label>
      <select id="eventSelect">${events.map(function(e){ return `<option value="${e.id}" ${e.id===selectedEventId?'selected':''}>${escapeHtml(e.name)} ${e.recurring==='weekly'?'(Weekly - '+DAY_NAMES[Number(e.dayOfWeek)]+')':'('+escapeHtml(e.date)+')'}</option>`; }).join('')}</select>
    </div>
    ${isRecurring? `<div class="field"><label>Session Date (this week's meeting)</label><input type="date" id="sessionDateInput" value="${sessionDate}" max="${todayStr()}"></div>` : ''}
    ${isRecurring? (function(){
      const pastDates = Array.from(new Set(attendance.filter(function(a){ return a.eventId===selectedEventId; }).map(function(a){ return a.sessionDate; }).filter(Boolean))).sort().reverse().slice(0,8);
      if(!pastDates.length) return '';
      return `<div class="section-title">Recent Sessions</div><div class="card log-list">${pastDates.map(function(d){
        const count = attendance.filter(function(a){ return a.eventId===selectedEventId && a.sessionDate===d && a.status==='present'; }).length;
        return `<div class="log-row clickable" data-action="jump-session" data-date="${d}" style="cursor:pointer;">
          <div class="log-dot ${d===sessionDate?'present':'absent'}" style="background:${d===sessionDate?'var(--primary)':'var(--border)'};"></div>
          <div style="flex:1;"><div class="log-date">${escapeHtml(formatDateNice(d))}</div><div class="log-sub">${count} attended</div></div>
          ${d===sessionDate? `<span class="badge badge-indigo">Viewing</span>` : ''}
        </div>`;
      }).join('')}</div>`;
    })() : ''}
    ${volunteers.length? rows : emptyState('👥','Add volunteers first to take attendance.')}
    ` : emptyState('📅','Add an event first to take attendance.')}
    `;
  } else {
    const attendance = getAttendance();
    const dueEvents = getEvents().filter(function(e){ return eventIsDueToday(e); });
    const historyRows = attendance.slice().sort(function(a,b){ return (b.time||'').localeCompare(a.time||''); }).map(function(a){
      const ev = getEvents().find(function(e){ return e.id===a.eventId; });
      const displayDate = a.sessionDate || (ev?ev.date:'-');
      return `<tr><td>${escapeHtml(ev? ev.name : 'Deleted event')}</td><td>${escapeHtml(displayDate)}</td><td><span class="badge ${a.status==='present'?'badge-green':'badge-red'}">${a.status}</span></td><td>${a.status==='present'?(Number(a.hours)||0):'-'}</td><td>${Number(a.contribution)||0}</td></tr>`;
    }).join('');
    return `
    <div class="section-title">Check In Today</div>
    ${dueEvents.length? dueEvents.map(function(e){
      const sd = currentSessionDate(e);
      const rec = attendance.find(function(a){ return a.eventId===e.id && a.volunteerId===currentUser.volunteerId && (a.sessionDate||e.date)===sd; });
      return `<div class="card"><h3>${escapeHtml(e.name)}</h3><div class="meta">📍 ${escapeHtml(e.location||'-')}</div>
        ${rec && rec.status==='present' ? `<span class="badge badge-green">✅ Checked In</span>` : `<button class="btn btn-sm" data-action="self-checkin" data-eid="${e.id}" style="margin-top:8px;">Check In</button>`}
      </div>`;
    }).join('') : emptyState('📅','No events scheduled for today.')}
    <div class="section-title">My Attendance History<span style="font-size:12px; font-weight:600; color:var(--muted);">${totalHoursFor(currentUser.volunteerId)} hrs &middot; ${totalContributionFor(currentUser.volunteerId)} paid</span></div>
    ${attendance.length? `<div class="card"><table><thead><tr><th>Event</th><th>Date</th><th>Status</th><th>Hrs</th><th>Paid</th></tr></thead><tbody>${historyRows}</tbody></table></div>` : emptyState('✅','No attendance records yet.')}
    `;
  }
}

/* ============================= EVENT BINDINGS ============================= */
function bindPageEvents(){
  const el = document.getElementById('pageContent');
  if(!el) return;

  const searchInput = document.getElementById('volunteerSearchInput');
  if(searchInput) searchInput.addEventListener('input', function(){ volunteerSearch = searchInput.value; renderPage(); });

  const eventSearchInput = document.getElementById('eventSearchInput');
  if(eventSearchInput) eventSearchInput.addEventListener('input', function(){ eventSearch = eventSearchInput.value; renderPage(); });

  const eventCategoryFilterSelect = document.getElementById('eventCategoryFilterSelect');
  if(eventCategoryFilterSelect) eventCategoryFilterSelect.addEventListener('change', function(){ eventCategoryFilter = eventCategoryFilterSelect.value; renderPage(); });

  const toggleAddAdmin = document.getElementById('toggleAddAdmin');
  if(toggleAddAdmin) toggleAddAdmin.addEventListener('click', function(){ showAddAdminForm=!showAddAdminForm; renderPage(); });

  const addAdminForm = document.getElementById('addAdminForm');
  if(addAdminForm){
    addAdminForm.addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('admin_name').value.trim();
      const email = document.getElementById('admin_email').value.trim();
      const password = document.getElementById('admin_password').value;
      const errEl = document.getElementById('admin_error');
      errEl.textContent='';
      if(!name || !email){ errEl.textContent='Name and email are required.'; return; }
      if(password.length < 6){ errEl.textContent='Password must be at least 6 characters.'; return; }
      const btn = addAdminForm.querySelector('button[type=submit]');
      btn.disabled=true; btn.textContent='Creating...';
      createAdminLogin(name, email, password).then(function(){
        showAddAdminForm=false;
        renderPage();
      }).catch(function(err){
        errEl.textContent = friendlyAuthError(err);
        btn.disabled=false; btn.textContent='Create Admin';
      });
    });
  }

  const toggleAddVol = document.getElementById('toggleAddVolunteer');
  if(toggleAddVol) toggleAddVol.addEventListener('click', function(){ showAddVolunteerForm=!showAddVolunteerForm; renderPage(); });

  const addVolForm = document.getElementById('addVolunteerForm');
  if(addVolForm){
    const createLoginCb = document.getElementById('v_createLogin');
    createLoginCb.addEventListener('change', function(){
      document.getElementById('v_loginFields').style.display = createLoginCb.checked? 'block':'none';
    });
    addVolForm.addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('v_name').value.trim();
      const errEl = document.getElementById('v_error');
      errEl.textContent='';
      if(!name){ errEl.textContent='Name is required.'; return; }
      const newVol = {
        name: name,
        phone: document.getElementById('v_phone').value.trim(),
        email: document.getElementById('v_email').value.trim(),
        skills: document.getElementById('v_skills').value.trim(),
        photo: pendingPhotoData || '',
        joinDate: todayStr()
      };
      const submitBtn = addVolForm.querySelector('button[type=submit]');
      submitBtn.disabled=true; submitBtn.textContent='Saving...';
      db.collection('volunteers').add(newVol).then(function(docRef){
        if(createLoginCb.checked){
          const loginEmail = document.getElementById('v_username').value.trim();
          const loginPassword = document.getElementById('v_password').value.trim();
          if(!loginEmail || loginPassword.length < 6){
            errEl.textContent='Enter a valid email and a password of at least 6 characters for the login.';
            submitBtn.disabled=false; submitBtn.textContent='Save Volunteer';
            return Promise.reject(new Error('validation'));
          }
          return createVolunteerLogin(name, loginEmail, loginPassword, docRef.id);
        }
      }).then(function(){
        showAddVolunteerForm=false; pendingPhotoData=null;
        renderPage();
      }).catch(function(err){
        if(err && err.message!=='validation'){ errEl.textContent = friendlyAuthError(err); }
        submitBtn.disabled=false; submitBtn.textContent='Save Volunteer';
      });
    });
  }

  const profileForm = document.getElementById('profileForm');
  if(profileForm){
    const photoInput = document.getElementById('p_photo');
    if(photoInput){
      photoInput.addEventListener('change', function(){
        const file = this.files[0]; if(!file) return;
        resizeImageFile(file, 320, 0.7, function(dataUrl){
          pendingPhotoData = dataUrl;
          const preview = document.getElementById('p_photoPreview');
          const img = document.createElement('img');
          img.className='avatar avatar-lg'; img.id='p_photoPreview'; img.src=dataUrl;
          preview.replaceWith(img);
        });
      });
    }
    profileForm.addEventListener('submit', function(e){
      e.preventDefault();
      const vid = profileForm.dataset.vid;
      const name = document.getElementById('p_name').value.trim();
      if(!name) return;
      const updates = {
        name: name,
        phone: document.getElementById('p_phone').value.trim(),
        email: document.getElementById('p_email').value.trim(),
        skills: document.getElementById('p_skills').value.trim()
      };
      if(pendingPhotoData) updates.photo = pendingPhotoData;
      const submitBtn = profileForm.querySelector('button[type=submit]');
      submitBtn.disabled=true;
      db.collection('volunteers').doc(vid).update(updates).then(function(){
        const linkedUser = getUsers().find(function(u){ return u.volunteerId===vid; });
        if(linkedUser) return db.collection('users').doc(linkedUser.uid).update({name:name});
        if(currentUser.volunteerId===vid){ return db.collection('users').doc(currentUser.uid).update({name:name}); }
      }).then(function(){
        pendingPhotoData=null;
        const successEl = document.getElementById('p_success');
        if(successEl) successEl.textContent='Saved!';
        submitBtn.disabled=false;
      }).catch(function(err){
        submitBtn.disabled=false;
        alert('Could not save: '+err.message);
      });
    });
  }

  const toggleAddEvt = document.getElementById('toggleAddEvent');
  if(toggleAddEvt) toggleAddEvt.addEventListener('click', function(){ showAddEventForm=!showAddEventForm; renderPage(); });

  const recurringCb = document.getElementById('e_recurring');
  if(recurringCb){
    recurringCb.addEventListener('change', function(){
      document.getElementById('e_recurringFields').style.display = recurringCb.checked? 'block':'none';
      document.getElementById('e_dateField').style.display = recurringCb.checked? 'none':'block';
      document.getElementById('e_date').required = !recurringCb.checked;
    });
  }

  const addEvtForm = document.getElementById('addEventForm');
  if(addEvtForm){
    addEvtForm.addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('e_name').value.trim();
      const isRecurring = document.getElementById('e_recurring').checked;
      const date = document.getElementById('e_date').value;
      const errEl = document.getElementById('e_error');
      if(!name){ errEl.textContent='Name is required.'; return; }
      if(!isRecurring && !date){ errEl.textContent='Date is required.'; return; }
      const eventData = {
        name: name,
        category: document.getElementById('e_category').value,
        time: document.getElementById('e_time').value,
        location: document.getElementById('e_location').value.trim(),
        description: document.getElementById('e_desc').value.trim()
      };
      if(isRecurring){
        eventData.recurring = 'weekly';
        eventData.dayOfWeek = parseInt(document.getElementById('e_dayOfWeek').value, 10);
        eventData.date = todayStr();
      } else {
        eventData.date = date;
      }
      db.collection('events').add(eventData).then(function(){
        showAddEventForm=false; renderPage();
      }).catch(function(err){ errEl.textContent = err.message; });
    });
  }

  const eventSelect = document.getElementById('eventSelect');
  if(eventSelect) eventSelect.addEventListener('change', function(){ selectedEventId = eventSelect.value; attendanceSessionDate=null; renderPage(); });

  const logoUpload = document.getElementById('logoUpload');
  if(logoUpload){
    logoUpload.addEventListener('change', function(){
      const file = this.files[0]; if(!file) return;
      resizeImageFile(file, 300, 0.7, function(dataUrl){
        db.collection('settings').doc('app').set({logoData:dataUrl}, {merge:true});
      });
    });
  }
  const savePortalNameBtn = document.getElementById('savePortalName');
  if(savePortalNameBtn){
    savePortalNameBtn.addEventListener('click', function(){
      const val = document.getElementById('portalNameInput').value.trim() || 'Volunteer Portal';
      db.collection('settings').doc('app').set({portalName:val}, {merge:true});
    });
  }
  const saveAnnouncementBtn = document.getElementById('saveAnnouncement');
  if(saveAnnouncementBtn){
    saveAnnouncementBtn.addEventListener('click', function(){
      const val = document.getElementById('announcementInput').value.trim();
      db.collection('settings').doc('app').set({announcement:val}, {merge:true});
    });
  }
  const clearAnnouncementBtn = document.getElementById('clearAnnouncement');
  if(clearAnnouncementBtn){
    clearAnnouncementBtn.addEventListener('click', function(){
      db.collection('settings').doc('app').set({announcement:''}, {merge:true});
    });
  }
  const saveContactEmailBtn = document.getElementById('saveContactEmail');
  if(saveContactEmailBtn){
    saveContactEmailBtn.addEventListener('click', function(){
      const val = document.getElementById('contactEmailInput').value.trim();
      db.collection('settings').doc('app').set({contactEmail:val}, {merge:true});
    });
  }
  const askForm = document.getElementById('askForm');
  if(askForm){
    askForm.addEventListener('submit', function(e){
      e.preventDefault();
      const q = document.getElementById('questionInput').value.trim();
      const errEl = document.getElementById('ask_error');
      if(!q){ errEl.textContent='Please type a question.'; return; }
      const btn = askForm.querySelector('button[type=submit]');
      btn.disabled=true; btn.textContent='Sending...';
      db.collection('questions').add({
        volunteerId: currentUser.volunteerId,
        askedByName: currentUser.name || currentUser.email,
        question: q,
        status: 'pending',
        time: new Date().toISOString()
      }).then(function(){
        renderPage();
      }).catch(function(err){
        errEl.textContent = err.message;
        btn.disabled=false; btn.textContent='Send Question';
      });
    });
  }
  const exportVolunteersBtn = document.getElementById('exportVolunteersCsv');
  if(exportVolunteersBtn){
    exportVolunteersBtn.addEventListener('click', function(){
      const rows = [['Name','Phone','Email','Skills','Joined','Total Hours','Total Contribution']];
      getVolunteers().forEach(function(v){
        rows.push([v.name, v.phone||'', v.email||'', v.skills||'', v.joinDate||'', totalHoursFor(v.id), totalContributionFor(v.id)]);
      });
      downloadCSV('volunteers.csv', rows);
    });
  }
  const exportAttendanceBtn = document.getElementById('exportAttendanceCsv');
  if(exportAttendanceBtn){
    exportAttendanceBtn.addEventListener('click', function(){
      const ev = getEvents().find(function(e){ return e.id===selectedEventId; });
      const rows = [['Volunteer','Status','Hours','Contribution','Event','Session Date']];
      getAttendance().filter(function(a){ return a.eventId===selectedEventId; }).forEach(function(a){
        const v = getVolunteers().find(function(vv){ return vv.id===a.volunteerId; });
        rows.push([v?v.name:'Unknown', a.status, a.status==='present'?(a.hours||0):'', a.contribution||0, ev?ev.name:'', a.sessionDate||(ev?ev.date:'')]);
      });
      downloadCSV('attendance-'+(ev?(ev.recurring==='weekly'?attendanceSessionDate:ev.date):'export')+'.csv', rows);
    });
  }
  document.querySelectorAll('[data-action="set-hours"]').forEach(function(inp){
    inp.addEventListener('change', function(){
      const hrs = parseFloat(inp.value)||0;
      const rec = getAttendance().find(function(a){ return a.eventId===selectedEventId && a.volunteerId===inp.dataset.vid && (a.sessionDate||attendanceSessionDate)===attendanceSessionDate; });
      const status = rec? rec.status : 'present';
      upsertAttendance(selectedEventId, inp.dataset.vid, status, attendanceSessionDate, hrs);
    });
  });
  document.querySelectorAll('[data-action="set-contribution"]').forEach(function(inp){
    inp.addEventListener('change', function(){
      const amt = parseFloat(inp.value)||0;
      const rec = getAttendance().find(function(a){ return a.eventId===selectedEventId && a.volunteerId===inp.dataset.vid && (a.sessionDate||attendanceSessionDate)===attendanceSessionDate; });
      const status = rec? rec.status : 'absent';
      upsertAttendance(selectedEventId, inp.dataset.vid, status, attendanceSessionDate, null, amt);
    });
  });
  const sessionDateInput = document.getElementById('sessionDateInput');
  if(sessionDateInput){
    sessionDateInput.addEventListener('change', function(){
      const picked = sessionDateInput.value;
      attendanceSessionDate = picked > todayStr() ? todayStr() : picked;
      renderPage();
    });
  }

  el.addEventListener('click', function(e){
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;

    if(action==='view-volunteer'){ selectedVolunteerId = btn.dataset.id; currentPage='volunteer-detail'; renderPage(); }
    else if(action==='goto-profile'){ currentPage='profile'; render(); }
    else if(action==='goto-analytics'){ currentPage='analytics'; renderPage(); }
    else if(action==='goto-qa'){ currentPage='qa'; render(); }
    else if(action==='back-to-dashboard'){ currentPage='dashboard'; renderPage(); }
    else if(action==='jump-session'){ attendanceSessionDate = btn.dataset.date; renderPage(); }
    else if(action==='answer-question'){
      const qid = btn.dataset.qid;
      const ta = el.querySelector('[data-action="answer-input"][data-qid="'+qid+'"]');
      const answer = ta? ta.value.trim() : '';
      if(!answer) return;
      db.collection('questions').doc(qid).update({answer:answer, status:'answered', answeredTime:new Date().toISOString()});
    }
    else if(action==='back-to-volunteers'){ currentPage='volunteers'; renderPage(); }
    else if(action==='delete-volunteer'){
      const id = btn.dataset.id;
      if(!confirm('Delete this volunteer? This removes their portal access and attendance records.')) return;
      const linkedUser = getUsers().find(function(u){ return u.volunteerId===id; });
      const jobs = [db.collection('volunteers').doc(id).delete()];
      if(linkedUser) jobs.push(db.collection('users').doc(linkedUser.uid).delete());
      jobs.push(db.collection('attendance').where('volunteerId','==',id).get().then(function(snap){
        const batch = db.batch();
        snap.forEach(function(d){ batch.delete(d.ref); });
        return batch.commit();
      }));
      Promise.all(jobs).then(function(){ currentPage='volunteers'; renderPage(); });
    }
    else if(action==='delete-event'){
      const id = btn.dataset.id;
      if(!confirm('Delete this event? This also removes its attendance records.')) return;
      Promise.all([
        db.collection('events').doc(id).delete(),
        db.collection('attendance').where('eventId','==',id).get().then(function(snap){
          const batch = db.batch();
          snap.forEach(function(d){ batch.delete(d.ref); });
          return batch.commit();
        })
      ]).then(function(){ if(selectedEventId===id) selectedEventId=null; renderPage(); });
    }
    else if(action==='mark-attendance'){ upsertAttendance(selectedEventId, btn.dataset.vid, btn.dataset.status, attendanceSessionDate); }
    else if(action==='self-checkin'){
      const ev = getEvents().find(function(e){ return e.id===btn.dataset.eid; });
      upsertAttendance(btn.dataset.eid, currentUser.volunteerId, 'present', ev? currentSessionDate(ev) : todayStr());
    }
    else if(action==='choose-theme'){
      const preset = THEME_PRESETS.find(function(t){ return t.name===btn.dataset.name; });
      if(preset) db.collection('settings').doc('app').set({theme:preset}, {merge:true});
    }
    else if(action==='remove-logo'){ db.collection('settings').doc('app').set({logoData:null}, {merge:true}); }
    else if(action==='rsvp-yes'){
      const eid = btn.dataset.eid;
      const existing = getRsvps().find(function(r){ return r.eventId===eid && r.volunteerId===currentUser.volunteerId; });
      if(existing){ db.collection('rsvps').doc(existing.id).update({response:'yes', time:new Date().toISOString()}); }
      else { db.collection('rsvps').add({eventId:eid, volunteerId:currentUser.volunteerId, response:'yes', time:new Date().toISOString()}); }
    }
    else if(action==='rsvp-cancel'){
      const eid = btn.dataset.eid;
      const existing = getRsvps().find(function(r){ return r.eventId===eid && r.volunteerId===currentUser.volunteerId; });
      if(existing) db.collection('rsvps').doc(existing.id).delete();
    }
    else if(action==='grant-admin'){
      if(!confirm('Give this person full admin access? They will be able to manage all volunteers, events, and settings.')) return;
      promoteToAdmin(btn.dataset.uid).then(function(){ renderPage(); });
    }
  });
}

function attendanceDocId(eventId, volunteerId, sessionDate){
  return (eventId+'_'+volunteerId+'_'+sessionDate).replace(/[^a-zA-Z0-9_-]/g, '_');
}
function upsertAttendance(eventId, volunteerId, status, sessionDate, hours, contribution){
  const ev = getEvents().find(function(e){ return e.id===eventId; });
  const sd = sessionDate || (ev? currentSessionDate(ev) : todayStr());
  const docId = attendanceDocId(eventId, volunteerId, sd);
  // Clean up any older duplicate records for this same person+session (from before this fix)
  const dupes = getAttendance().filter(function(a){
    return a.eventId===eventId && a.volunteerId===volunteerId && (a.sessionDate||sd)===sd && a.id!==docId;
  });
  const existing = getAttendance().find(function(a){ return a.id===docId; }) || dupes[0];
  const data = {eventId:eventId, volunteerId:volunteerId, status:status, sessionDate:sd, time:new Date().toISOString()};
  if(hours!=null) data.hours = hours;
  else if(existing && existing.hours!=null) data.hours = existing.hours;
  else if(status==='present') data.hours = 2;
  if(contribution!=null) data.contribution = contribution;
  else if(existing && existing.contribution!=null) data.contribution = existing.contribution;
  else if(status==='present') data.contribution = 0;
  db.collection('attendance').doc(docId).set(data, {merge:true}).then(function(){
    dupes.forEach(function(d){ db.collection('attendance').doc(d.id).delete(); });
  });
}

/* ============================= START ============================= */
initApp();
</script>
