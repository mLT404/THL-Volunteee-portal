<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C8102E">
  <title>THL Volunteer Portal</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: #1a1c21;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .cross {
      width: 64px;
      height: 64px;
      background: #c8102e;
      position: relative;
      margin-bottom: 20px;
      border-radius: 6px;
    }

    .cross:before {
      content: "";
      position: absolute;
      width: 60%;
      height: 22%;
      background: white;
      left: 20%;
      top: 39%;
    }

    .cross:after {
      content: "";
      position: absolute;
      width: 22%;
      height: 60%;
      background: white;
      left: 39%;
      top: 20%;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #1a1c21;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 15px 50px rgba(0,0,0,.3);
    }

    .login-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
    }

    .login-title {
      text-align: center;
      margin: 0;
      color: #c8102e;
      font-size: 25px;
    }

    .login-subtitle {
      text-align: center;
      color: #6b7280;
      margin: 8px 0 25px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #c8102e;
    }

    .btn {
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      font-weight: bold;
      color: white;
      background: #c8102e;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn.secondary {
      background: #374151;
    }

    .btn.green {
      background: #287a50;
    }

    .btn.full {
      width: 100%;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .demo {
      margin-top: 18px;
      background: #f3f4f6;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #4b5563;
    }

    .app {
      min-height: 100vh;
    }

    .topbar {
      height: 64px;
      background: #1a1c21;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    .small-cross {
      width: 34px;
      height: 34px;
      background: #c8102e;
      position: relative;
      border-radius: 4px;
    }

    .small-cross:before {
      content: "";
      position: absolute;
      width: 60%;
      height: 20%;
      background: white;
      left: 20%;
      top: 40%;
    }

    .small-cross:after {
      content: "";
      position: absolute;
      width: 20%;
      height: 60%;
      background: white;
      left: 40%;
      top: 20%;
    }

    .top-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      width: 230px;
      background: white;
      border-right: 1px solid #e5e7eb;
      padding: 15px 10px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 4px;
      color: #374151;
      font-weight: 600;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: #f9e4e6;
      color: #c8102e;
    }

    .content {
      flex: 1;
      padding: 25px;
      min-width: 0;
    }

    .page-title {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .page-subtitle {
      margin: 0 0 25px;
      color: #6b7280;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 10px;
      padding: 20px;
      border-left: 5px solid #c8102e;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #6b7280;
      font-size: 14px;
    }

    .panel {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .panel-title {
      margin: 0 0 15px;
      font-size: 19px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 200px;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      background: #1a1c21;
      color: white;
      text-align: left;
      padding: 11px;
      font-size: 13px;
    }

    td {
      padding: 11px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    tr:hover td {
      background: #f9fafb;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge.active {
      background: #dcfce7;
      color: #166534;
    }

    .badge.inactive {
      background: #e5e7eb;
      color: #4b5563;
    }

    .badge.standby {
      background: #fef3c7;
      color: #92400e;
    }

    .badge.upcoming {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge.completed {
      background: #dcfce7;
      color: #166534;
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .event-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }

    .event-card h3 {
      margin: 0 0 8px;
    }

    .event-info {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.8;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 10px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close {
      background: transparent;
      border: 0;
      font-size: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-grid .full-field {
      grid-column: 1 / -1;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .event-grid {
        grid-template-columns: 1fr;
      }

      .sidebar {
        width: 190px;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 0 12px;
      }

      .top-user span {
        display: none;
      }

      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        overflow-x: auto;
        padding: 8px;
      }

      .nav-btn {
        min-width: 120px;
        margin: 0 3px;
        text-align: center;
      }

      .content {
        padding: 15px;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .full-field {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div id="loading" class="loading">
  <div class="cross"></div>
  <div>Loading THL Volunteer Portal...</div>
</div>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

const DEFAULT_VOLUNTEERS = [
  {
    id: "V001",
    name: "Marisol Ibarra",
    email: "marisol@thl.org",
    phone: "220-770-0142",
    chapter: "Tallinding Home Link",
    role: "Volunteer",
    status: "active",
    joined: "2023-03-11",
    emergency: "Fatou Ibarra - 220-770-9900"
  },
  {
    id: "V002",
    name: "Devon Wallace",
    email: "devon@thl.org",
    phone: "220-770-0198",
    chapter: "Kanifing Chapter",
    role: "Volunteer",
    status: "active",
    joined: "2022-11-02",
    emergency: "Anna Wallace - 220-770-8811"
  },
  {
    id: "V003",
    name: "Priya Natarajan",
    email: "priya@thl.org",
    phone: "220-770-0177",
    chapter: "Banjul Chapter",
    role: "Volunteer",
    status: "standby",
    joined: "2024-01-20",
    emergency: "Raj Natarajan - 220-770-7722"
  },
  {
    id: "V004",
    name: "Tomas Reyes",
    email: "tomas@thl.org",
    phone: "220-770-0163",
    chapter: "Tallinding Home Link",
    role: "Volunteer",
    status: "active",
    joined: "2021-07-15",
    emergency: ""
  }
];

const DEFAULT_EVENTS = [
  {
    id: "E001",
    title: "Tallinding Blood Drive",
    date: "2026-08-15",
    time: "08:00 - 14:00",
    location: "Tallinding Community Centre",
    category: "Blood Drive",
    status: "upcoming",
    volunteers: ["V001", "V004"]
  },
  {
    id: "E002",
    title: "Community First Aid Workshop",
    date: "2026-08-20",
    time: "10:00 - 14:00",
    location: "Tallinding School",
    category: "Training",
    status: "upcoming",
    volunteers: ["V002"]
  },
  {
    id: "E003",
    title: "Disaster Preparedness Training",
    date: "2026-08-25",
    time: "09:00 - 13:00",
    location: "THL Training Hall",
    category: "Disaster Response",
    status: "upcoming",
    volunteers: []
  }
];

function getStored(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}

function App() {

  const [loggedIn, setLoggedIn] = useState(
    localStorage.getItem("thl_logged_in") === "true"
  );

  const [user, setUser] = useState(
    localStorage.getItem("thl_user") || ""
  );

  const [page, setPage] = useState("dashboard");

  const [volunteers, setVolunteers] = useState(
    getStored("thl_volunteers", DEFAULT_VOLUNTEERS)
  );

  const [events, setEvents] = useState(
    getStored("thl_events", DEFAULT_EVENTS)
  );

  const [showVolunteer, setShowVolunteer] = useState(false);
  const [showEvent, setShowEvent] = useState(false);

  useEffect(() => {
    localStorage.setItem("thl_volunteers", JSON.stringify(volunteers));
  }, [volunteers]);

  useEffect(() => {
    localStorage.setItem("thl_events", JSON.stringify(events));
  }, [events]);

  useEffect(() => {
    const timer = setTimeout(() => {
      const loading = document.getElementById("loading");
      if (loading) loading.style.display = "none";
    }, 500);

    return () => clearTimeout(timer);
  }, []);

  function login(email, password) {

    if (email === "admin@thl.org" && password === "Admin@123") {
      localStorage.setItem("thl_logged_in", "true");
      localStorage.setItem("thl_user", "Administrator");
      setUser("Administrator");
      setLoggedIn(true);
      return true;
    }

    if (email === "marisol@thl.org" && password === "Vol@123") {
      localStorage.setItem("thl_logged_in", "true");
      localStorage.setItem("thl_user", "Marisol Ibarra");
      setUser("Marisol Ibarra");
      setLoggedIn(true);
      return true;
    }

    return false;
  }

  function logout() {
    localStorage.removeItem("thl_logged_in");
    localStorage.removeItem("thl_user");
    setLoggedIn(false);
    setUser("");
    setPage("dashboard");
  }

  function addVolunteer(v) {
    const newVolunteer = {
      ...v,
      id: "V" + String(volunteers.length + 1).padStart(3, "0")
    };

    setVolunteers([...volunteers, newVolunteer]);
    setShowVolunteer(false);
  }

  function deleteVolunteer(id) {
    if (!confirm("Delete this volunteer?")) return;

    setVolunteers(
      volunteers.filter(v => v.id !== id)
    );
  }

  function addEvent(e) {
    const newEvent = {
      ...e,
      id: "E" + String(events.length + 1).padStart(3, "0"),
      status: "upcoming",
      volunteers: []
    };

    setEvents([...events, newEvent]);
    setShowEvent(false);
  }

  function deleteEvent(id) {
    if (!confirm("Delete this event?")) return;

    setEvents(
      events.filter(e => e.id !== id)
    );
  }

  if (!loggedIn) {
    return (
      <Login onLogin={login} />
    );
  }

  return (
    <div className="app">

      <header className="topbar">

        <div className="brand">
          <div className="small-cross"></div>
          <div>
            Tallinding Home Link
            <div style={{fontSize:"11px",fontWeight:"normal",color:"#aaa"}}>
              Volunteer Portal
            </div>
          </div>
        </div>

        <div className="top-user">
          <span>{user}</span>
          <button
            className="btn"
            onClick={logout}
            style={{padding:"8px 12px"}}
          >
            Logout
          </button>
        </div>

      </header>

      <div className="layout">

        <aside className="sidebar">

          <button
            className={"nav-btn " + (page === "dashboard" ? "active" : "")}
            onClick={() => setPage("dashboard")}
          >
            🏠 Dashboard
          </button>

          <button
            className={"nav-btn " + (page === "volunteers" ? "active" : "")}
            onClick={() => setPage("volunteers")}
          >
            👥 Volunteers
          </button>

          <button
            className={"nav-btn " + (page === "events" ? "active" : "")}
            onClick={() => setPage("events")}
          >
            📅 Events
          </button>

          <button
            className={"nav-btn " + (page === "attendance" ? "active" : "")}
            onClick={() => setPage("attendance")}
          >
            ✅ Attendance
          </button>

        </aside>

        <main className="content">

          {page === "dashboard" && (
            <Dashboard
              volunteers={volunteers}
              events={events}
              setPage={setPage}
            />
          )}

          {page === "volunteers" && (
            <Volunteers
              volunteers={volunteers}
              onAdd={() => setShowVolunteer(true)}
              onDelete={deleteVolunteer}
            />
          )}

          {page === "events" && (
            <Events
              events={events}
              volunteers={volunteers}
              onAdd={() => setShowEvent(true)}
              onDelete={deleteEvent}
            />
          )}

          {page === "attendance" && (
            <Attendance
              events={events}
              volunteers={volunteers}
            />
          )}

        </main>

      </div>

      {showVolunteer && (
        <VolunteerModal
          onClose={() => setShowVolunteer(false)}
          onSave={addVolunteer}
        />
      )}

      {showEvent && (
        <EventModal
          onClose={() => setShowEvent(false)}
          onSave={addEvent}
        />
      )}

    </div>
  );
}


function Login({onLogin}) {

  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  function submit(e) {
    e.preventDefault();

    if (!onLogin(email.trim(), password)) {
      setError("Incorrect email or password.");
    }
  }

  return (
    <div className="login-page">

      <div className="login-card">

        <div className="login-logo cross"></div>

        <h1 className="login-title">
          THL Volunteer Portal
        </h1>

        <p className="login-subtitle">
          Tallinding Home Link
        </p>

        {error && (
          <div className="error">
            {error}
          </div>
        )}

        <form onSubmit={submit}>

          <div className="field">
            <label>Email</label>
            <input
              type="email"
              value={email}
              onChange={e => setEmail(e.target.value)}
              placeholder="Enter your email"
              required
            />
          </div>

          <div className="field">
            <label>Password</label>
            <input
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              placeholder="Enter your password"
              required
            />
          </div>

          <button className="btn full">
            Sign In
          </button>

        </form>

        <div className="demo">
          <strong>Demo Administrator</strong><br>
          Email: admin@thl.org<br>
          Password: Admin@123
          <br><br>
          <strong>Demo Volunteer</strong><br>
          Email: marisol@thl.org<br>
          Password: Vol@123
        </div>

      </div>

    </div>
  );
}


function Dashboard({volunteers, events, setPage}) {

  const active = volunteers.filter(v => v.status === "active").length;

  const upcoming = events.filter(
    e => e.status === "upcoming"
  ).length;

  return (
    <>

      <h1 className="page-title">
        Dashboard
      </h1>

      <p className="page-subtitle">
        Welcome to the Tallinding Home Link Volunteer Portal.
      </p>

      <div className="cards">

        <div className="stat">
          <div className="stat-number">
            {volunteers.length}
          </div>
          <div className="stat-label">
            Total Volunteers
          </div>
        </div>

        <div className="stat">
          <div className="stat-number">
            {active}
          </div>
          <div className="stat-label">
            Active Volunteers
          </div>
        </div>

        <div className="stat">
          <div className="stat-number">
            {upcoming}
          </div>
          <div className="stat-label">
            Upcoming Events
          </div>
        </div>

        <div className="stat">
          <div className="stat-number">
            {volunteers.filter(v => v.status === "standby").length}
          </div>
          <div className="stat-label">
            Standby Vol
