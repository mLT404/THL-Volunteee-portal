<script>

/* ============================= CONSTANTS ============================= */
const THEME_PRESETS=[
  {name:'Indigo', primary:'#4f46e5', primaryDark:'#4338ca', bg:'#f4f5f9', ic:'🟣'},
  {name:'Ocean',  primary:'#0284c7', primaryDark:'#0369a1', bg:'#f0f9ff', ic:'🔵'},

/* ============================= HELPERS ============================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
}
function friendlyAuthError(err){
  const code = (err && err.code) || '';
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
  if(code.includes('invalid-email')) return 'That email address looks invalid.';
  if(code.includes('email-already-in-use')) return 'That email is already registered.';
  if(code.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(code.includes('too-many-requests')) return 'Too many attempts. Try again later.';
  if(code.includes('network')) return 'Network error. Check your connection.';
  return (err && err.message) || 'Something went wrong. Please try again.';
}
function resizeImageFile(file, maxDim, quality, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================= CACHES (live from Firestore) ============================= */
let volunteersCache=[], eventsCache=[], attendanceCache=[], usersCache=[];
let settingsCache={ adminCreated:false, logoData:null, portalName:'Volunteer Portal', theme:THEME_PRESETS[0] };
let settingsLoaded=false;

function getEvents(){ return eventsCache; }
function getAttendance(){ return attendanceCache; }
function getUsers(){ return usersCache; }
function getSettings(){ return settingsCache; }

/* ============================= APP STATE ============================= */
let currentUser=null;
let currentPage='dashboard';
let showAddVolunteerForm=false;
let showAddEventForm=false;
let volunteerSearch='';
let selectedEventId=null;
let selectedVolunteerId=null;
let loginError='';
let setupError='';
let pendingPhotoData=null;
let settingUpInProgress=false;

/* ============================= FIRESTORE LISTENERS ============================= */
let unsubSettings=null, unsubVolunteers=null, unsubEvents=null, unsubAttendance=null, unsubUsers=null;

function startPublicListeners(){
  unsubSettings = db.collection('settings').doc('app').onSnapshot(function(doc){
    if(doc.exists){ settingsCache = Object.assign({}, settingsCache, doc.data()); }
    settingsLoaded = true;
    applyTheme();
    render();
  }, function(){ settingsLoaded = true; render(); });
}

function startPrivateListeners(){
  if(currentUser.role==='admin'){
    unsubVolunteers = db.collection('volunteers').onSnapshot(function(snap){
      volunteersCache = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderPage();
    });
    unsubUsers = db.collection('users').onSnapshot(function(snap){
      usersCache = snap.docs.map(function(d){ return Object.assign({id:d.id, uid:d.id}, d.data()); });
      renderPage();
    });
    unsubAttendance = db.collection('attendance').onSnapshot(function(snap){
      attendanceCache = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderPage();
    });
  } else {
    if(currentUser.volunteerId){
      unsubVolunteers = db.collection('volunteers').doc(currentUser.volunteerId).onSnapshot(function(doc){
        volunteersCache = doc.exists ? [Object.assign({id:doc.id}, doc.data())] : [];
        renderPage();
      });
      unsubAttendance = db.collection('attendance').where('volunteerId','==',currentUser.volunteerId).onSnapshot(function(snap){
        attendanceCache = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        renderPage();
      });
    }
  }
  unsubEvents = db.collection('events').onSnapshot(function(snap){
    eventsCache = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderPage();
  });
}
function stopPrivateListeners(){
  [unsubVolunteers,unsubEvents,unsubAttendance,unsubUsers].forEach(function(u){ if(u) u(); });
  unsubVolunteers=unsubEvents=unsubAttendance=unsubUsers=null;
  volunteersCache=[]; eventsCache=[]; attendanceCache=[]; usersCache=[];
}

function applyTheme(){
  const t = settingsCache.theme || THEME_PRESETS[0];
  document.documentElement.style.setProperty('--primary', t.primary);
  document.documentElement.style.setProperty('--primary-dark', t.primaryDark);
  document.documentElement.style.setProperty('--bg', t.bg);
}

/* ============================= AUTH ============================= */
auth.onAuthStateChanged(async function(fbUser){
  if(fbUser){
    if(settingUpInProgress) return; // doSetup() manages currentUser itself
    try{
      const doc = await db.collection('users').doc(fbUser.uid).get();
      if(!doc.exists){
        loginError='Your account was not found. It may have been removed by an admin.';
        await auth.signOut();
        currentUser=null; render(); return;
      }
      currentUser = Object.assign({uid:fbUser.uid, email:fbUser.email}, doc.data());
      startPrivateListeners();
      currentPage='dashboard';
      render();
    }catch(e){
      loginError='Could not load your account. Check your connection and try again.';
      await auth.signOut();
      render();
    }
  } else {
    currentUser=null;
    stopPrivateListeners();
    render();
  }
});

function initApp(){
  startPublicListeners();
  render();
}

function doLogin(email, password){
  loginError='';
  auth.signInWithEmailAndPassword(email.trim(), password).catch(function(err){
    loginError = friendlyAuthError(err);
    render();
  });
}
function doLogout(){ auth.signOut(); }

function doSetup(name, email, password){
  setupError='';
  if(password.length < 6){ setupError='Password must be at least 6 characters.'; render(); return; }
  settingUpInProgress = true;
  auth.createUserWithEmailAndPassword(email.trim(), password).then(function(cred){
    const profile = {role:'admin', name:name, email:email.trim()};
    return db.collection('users').doc(cred.user.uid).set(profile)
      .then(function(){
        return db.collection('settings').doc('app').set({
          adminCreated:true,
          portalName: settingsCache.portalName || 'Volunteer Portal',
          theme: settingsCache.theme || THEME_PRESETS[0]
        }, {merge:true});
      })
      .then(function(){
        currentUser = Object.assign({uid:cred.user.uid, email:email.trim()}, profile);
        settingUpInProgress=false;
        startPrivateListeners();
        currentPage='dashboard';
        render();
      });
  }).catch(function(err){
    settingUpInProgress=false;
    setupError = friendlyAuthError(err);
    render();
  });
}

function createVolunteerLogin(name, email, password, volunteerId){
  const secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary'+Date.now());
  return secondaryApp.auth().createUserWithEmailAndPassword(email.trim(), password)
    .then(function(cred){
      return db.collection('users').doc(cred.user.uid).set({role:'volunteer', name:name, email:email.trim(), volunteerId:volunteerId});
    })
    .then(function(){ return secondaryApp.auth().signOut(); })
    .then(function(){ return secondaryApp.delete(); });
}

/* ============================= RENDER ROOT ============================= */

  const app = document.getElementById('app');
  if(!settingsLoaded){ app.innerHTML = renderLoading(); return; }
  if(currentUser){

    bindShellEvents();
  } else if(!settingsCache.adminCreated){
    app.innerHTML = renderSetup();
    bindSetupEvents();

    app.innerHTML = renderLogin();

}
